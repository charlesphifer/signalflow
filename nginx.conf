server {
    listen       9090;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # API proxy → signalflow-api container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — serve index.html for any unmatched path so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-busted assets — long cache
    location /signalflow/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
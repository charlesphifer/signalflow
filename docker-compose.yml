services:
  frontend:
    build: .
    container_name: signalflow
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - api

  api:
    build: ./server
    container_name: signalflow-api
    restart: unless-stopped
    volumes:
      - signalflow_data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - JWT_SECRET=${SIGNALFLOW_JWT_SECRET:-change-me-in-env-file}
      - PARSER_TOKEN=${SIGNALFLOW_PARSER_TOKEN:-change-me-parser-token}

volumes:
  signalflow_data: